    en:[{badge:"IMPORTANT",bc:"#dbeafe",bt:"#1e40af",title:"Marriage Does NOT Revoke Your Will",body:"In Malaysia, getting married does NOT automatically revoke a previously made will. A divorce does not automatically update your will either."},{badge:"CRITICAL",bc:"#fee2e2",bt:"#b91c1c",title:"Joint Tenancy Bypasses Your Will",body:"Property held as 'joint tenants' passes AUTOMATICALLY to the surviving co-owner upon your death — regardless of what your will says."},{badge:"CRITICAL",bc:"#fee2e2",bt:"#b91c1c",title:"EPF Nominee ≠ Beneficiary",body:"Your EPF nominee is a TRUSTEE, not a direct beneficiary. They receive the EPF payout and are legally required to distribute it according to your will."},{badge:"IMPORTANT",bc:"#fef3c7",bt:"#78350f",title:"Insurance & Takaful Bypass Your Will",body:"Life insurance and Takaful payouts go directly to named beneficiaries — your will has no say over them."},{badge:"CRITICAL",bc:"#fee2e2",bt:"#b91c1c",title:"Witnessing Rules Are Strict",body:"Your will must be signed in the presence of 2 witnesses at the same time. A witness CANNOT be a beneficiary, and the spouse of a witness CANNOT be a beneficiary."},{badge:"IMPORTANT",bc:"#fef3c7",bt:"#78350f",title:"Foreign Assets Require Separate Wills",body:"A Malaysian will has no legal jurisdiction over assets held in other countries."},{badge:"NOTE",bc:"#dcfce7",bt:"#166534",title:"Minor Beneficiaries Cannot Receive Directly",body:"Anyone under 18 cannot legally receive assets directly. Without a trust in your will, the court appoints a management committee — slow and expensive."},{badge:"NOTE",bc:"#dcfce7",bt:"#166534",title:"Your Executor Carries a Heavy Responsibility",body:"Your executor deals with banks, LHDN, EPF, courts, and creditors for potentially 12–24 months. Choose someone organised, available, and practically capable."}],
    bm:[{badge:"PENTING",bc:"#dbeafe",bt:"#1e40af",title:"Perkahwinan TIDAK Membatalkan Wasiat",body:"Di Malaysia, berkahwin TIDAK secara automatik membatalkan wasiat yang dibuat sebelumnya. Perceraian juga tidak mengemas kini wasiat anda secara automatik."},{badge:"KRITIKAL",bc:"#fee2e2",bt:"#b91c1c",title:"Pegangan Bersama Memintas Wasiat",body:"Harta yang dipegang sebagai 'joint tenant' SECARA AUTOMATIK berpindah kepada pemilik bersama yang masih hidup — tanpa mengira apa yang dinyatakan dalam wasiat anda."},{badge:"KRITIKAL",bc:"#fee2e2",bt:"#b91c1c",title:"Penama KWSP ≠ Benefisiari",body:"Penama KWSP anda adalah PEMEGANG AMANAH, bukan benefisiari langsung. Mereka mesti mengagihkan bayaran KWSP mengikut wasiat anda."},{badge:"PENTING",bc:"#fef3c7",bt:"#78350f",title:"Insurans & Takaful Memintas Wasiat",body:"Bayaran insurans nyawa dan Takaful pergi terus kepada benefisiari yang dinamakan — wasiat anda tidak mempunyai kuasa ke atasnya."},{badge:"KRITIKAL",bc:"#fee2e2",bt:"#b91c1c",title:"Peraturan Penyaksian Adalah Ketat",body:"Wasiat anda mesti ditandatangani di hadapan 2 saksi yang hadir pada masa yang sama. Saksi TIDAK BOLEH menjadi benefisiari, dan pasangan saksi juga TIDAK BOLEH."},{badge:"PENTING",bc:"#fef3c7",bt:"#78350f",title:"Aset Luar Negara Memerlukan Wasiat Berasingan",body:"Wasiat Malaysia tidak mempunyai bidang kuasa ke atas aset yang dipegang di negara lain."},{badge:"NOTA",bc:"#dcfce7",bt:"#166534",title:"Benefisiari Bawah Umur Tidak Boleh Menerima Terus",body:"Sesiapa yang berumur bawah 18 tahun tidak boleh menerima aset secara langsung. Tanpa amanah dalam wasiat, mahkamah melantik jawatankuasa pengurusan."},{badge:"NOTA",bc:"#dcfce7",bt:"#166534",title:"Eksekutor Memikul Tanggungjawab Besar",body:"Eksekutor anda berurusan dengan bank, LHDN, KWSP, mahkamah, dan pemiutang selama 12–24 bulan. Pilih seseorang yang teratur dan berkemampuan."}],
    zh:[{badge:"重要",bc:"#dbeafe",bt:"#1e40af",title:"结婚不会自动撤销您的遗嘱",body:"在马来西亚，结婚不会自动撤销之前立下的遗嘱。同样，离婚也不会自动更新您的遗嘱。"},{badge:"关键",bc:"#fee2e2",bt:"#b91c1c",title:"联名持有产权将绕过您的遗嘱",body:"以“联名租户”（Joint Tenant）方式持有的房产，在您去世后将自动转移给在世的共同拥有人——无论您的遗嘱内容如何。"},{badge:"关键",bc:"#fee2e2",bt:"#b91c1c",title:"公积金（EPF）受益人≠遗产受益人",body:"您的公积金受益人是受托人，而非直接受益人。他们收到公积金款项后，依法须按照您的遗嘱进行分配。"},{badge:"重要",bc:"#fef3c7",bt:"#78350f",title:"保险及回教保险将绕过您的遗嘱",body:"人寿保险及回教保险（Takaful）的赔偿金直接支付给指定受益人——您的遗嘱对其无约束力。"},{badge:"关键",bc:"#fee2e2",bt:"#b91c1c",title:"见证规则严格",body:"您的遗嘱须在两名同时在场的见证人面前签署。见证人不得为受益人，见证人的配偶亦不得为受益人。"},{badge:"重要",bc:"#fef3c7",bt:"#78350f",title:"海外资产需另立遗嘱",body:"马来西亚遗嘱对其他国家持有的资产不具法律管辖权。"},{badge:"注意",bc:"#dcfce7",bt:"#166534",title:"未成年受益人不得直接接收资产",body:"18岁以下人士依法不能直接接收资产。若遗嘱未设立信托，法庭将指派管理委员会——过程缓慢且费用高昂。"},{badge:"注意",bc:"#dcfce7",bt:"#166534",title:"遗嘱执行人肩负重大责任",body:"遗嘱执行人需与銀行、税务局（LHDN）、公积金（EPF）、法庭及债权人周旋，可能长达12至24个月。"}]

function ET({f,style,multi=false}){
  const{em,cfg,setCfg}=useEdit();
  const v=cfg[f]||"";
  if(!em)return<span style={style}>{v}</span>;
  if(multi)return<textarea value={v} onChange={e=>setCfg(c=>({...c,[f]:e.target.value}))} className="em-hl" style={{...style,resize:"vertical",border:"none",padding:"3px 6px",fontFamily:"inherit",outline:"none",display:"block",width:"100%",minHeight:56}}/>;
  return<input value={v} onChange={e=>setCfg(c=>({...c,[f]:e.target.value}))} className="em-hl" style={{...style,border:"none",padding:"2px 6px",fontFamily:"inherit",outline:"none",display:"inline-block",minWidth:40}}/>;
}
function EditBanner(){
  const{em}=useEdit();const{lang}=useLang();
  if(!em)return null;
  return<div style={{background:"rgba(255,200,0,0.13)",border:"1px dashed rgba(200,160,0,0.55)",borderRadius:6,padding:"7px 16px",fontSize:11.5,fontWeight:700,color:"#78350f",margin:"12px 36px 0"}}>{t("edBanner",lang)}</div>;
}

function dlDOC(html,filename){
  const src=`<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>`+html.replace(/^<!DOCTYPE[^>]*>/i,'').replace(/<html[^>]*>/i,'');;
  const blob=new Blob(['﻿',src],{type:'application/msword'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

  const[saved,setSaved]=useState(false);
  const[track,sTrack]=useState("");
  const[step,sStep]=useState(0);
  const[ss,sSS]=useState("");
  const[lang,setLangRaw]=useState(loadLang);

  useEffect(()=>{document.body.style.fontFamily=cfg.fontFamily;document.body.style.fontSize=cfg.fontSize+"px";},[cfg.fontFamily,cfg.fontSize]);

  const setLang=l=>{setLangRaw(l);try{localStorage.setItem('atp-lang',l);}catch(e){}};
  const setCfg=upd=>{
    sCfg(prev=>{
      const next=typeof upd==="function"?upd(prev):upd;
      try{localStorage.setItem('atp-cfg-v7',JSON.stringify(next));}catch(e){}
      return next;
    });
  };
  const nav=p=>{setPage(p);sStep(0);window.scrollTo(0,0);};
  const onSave=()=>{
    try{localStorage.setItem('atp-cfg-v7',JSON.stringify(cfg));setSaved(true);setTimeout(()=>setSaved(false),2500);}
    catch(e){alert("Save failed — localStorage may be unavailable.");}
  };
  const onReset=()=>{
    if(!window.confirm("Reset all edits to defaults?"))return;
    localStorage.removeItem('atp-cfg-v7');sCfg(DEF);
    document.body.style.fontFamily=DEF.fontFamily;document.body.style.fontSize=DEF.fontSize+"px";
  };
  const onExport=()=>{
    try{
      const sc=document.querySelector('script[type="text/babel"]');
      if(!sc){alert("Export failed.");return;}
      const cfgStr=JSON.stringify(cfg,null,2);
      const newSrc=sc.textContent.replace(/const DEF=\{[\s\S]*?^\};/m,`const DEF=${cfgStr};`);
      const html=`<!DOCTYPE html>\n<html lang="en">\n<head>\n${document.head.innerHTML}\n</head>\n<body><div id="root"></div>\n<script type="text/babel">\n${newSrc}\n<\/script>\n</body>\n</html>`;
      const blob=new Blob([html],{type:"text/html"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='atp_will_generator_v7_custom.html';
      document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    }catch(e){alert("Export error: "+e.message);}
  };

  return(
    <LC.Provider value={{lang,setLang}}>
      <EC.Provider value={{em,cfg,setCfg}}>
        <div style={{fontFamily:cfg.fontFamily,background:"#f0f4fa",minHeight:"100vh",paddingRight:em?264:0}}>
          <NavBar setPage={nav} em={em} setEm={sEm}/>
          {page==="landing"&&<Landing setPage={nav}/>}
          {page==="track"&&<TrackSel setPage={nav} setTrack={sTrack}/>}
          {page==="nm-caveats"&&<NMCaveats setPage={nav}/>}
          {page==="nm-form"&&<NMForm setPage={nav} step={step} setStep={sStep}/>}
          {page==="m-caveats"&&<MCaveats setPage={nav}/>}
          {page==="m-state"&&<MState setPage={nav} ss={ss} setSS={sSS}/>}
          {page==="m-form"&&<MForm setPage={nav} step={step} setStep={sStep} ss={ss}/>}
          <EditorPanel em={em} onSave={onSave} onReset={onReset} onExport={onExport} saved={saved}/>
        </div>
      </EC.Provider>
    </LC.Provider>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
